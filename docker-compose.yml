services:
  # PHP Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: camsur-app
    container_name: camsur-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    ports:
      - "5173:5173"
    environment:
      DB_HOST: db
    volumes:
      - .:/var/www
    networks:
      - camsur-network

  # Nginx Webserver Container
  webserver:
    image: nginx:alpine
    container_name: camsur-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - camsur-network

  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: camsur-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: camsur_levelup_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: camsur_user
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - camsur-network

  # phpMyAdmin Web Interface Container
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: camsur-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    networks:
      - camsur-network
    depends_on:
      - db

networks:
  camsur-network:
    driver: bridge

volumes:
  dbdata:
    driver: local